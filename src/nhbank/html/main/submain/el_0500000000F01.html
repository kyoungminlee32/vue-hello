        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <a href="javascript:moveProductDetailPage(40000954)">

                            <div class="prd-sub">NH e사장님 부동산담보대출</div>
                        </div>
                        <div class="hash-tag"><span>#개인사업자</span><span>#담보대출</span></div>
                    </div>
                </a>
            </div>
            <div class="swiper-slide">
                <a href="javascript:moveProductDetailPage(40000938)">
                    <div class="submain-banner type01">
                        <div class="banner-txt-wrap">
                            <div class="prd-title">여러 보증기관을<br>한번에 비교하세요</div>
                            <div class="prd-sub">NH모바일전세대출+</div>
                        </div>
                        <div class="hash-tag"><span>#전세대출</span><span>#갈아타기</span></div>
                    </div>
                </a>
            </div>
            <div class="swiper-slide">
                <a href="javascript:moveProductDetailPage(40000890)">
                    <div class="submain-banner type02">
                        <div class="banner-txt-wrap">
                            <div class="prd-title">개인사업자 전용<br>비대면 즉시 신용대출</div>
                            <div class="prd-sub">NH e사장님 바로대출</div>
                        </div>
                        <div class="hash-tag"><span>#개인사업자</span><span>#신용대출</span></div>
                    </div>
                </a>
            </div> 
            <div class="swiper-slide">
                <a href="javascript:moveProductDetailPage(40000950)">
                    <div class="submain-banner type03">
                        <div class="banner-txt-wrap">
                            <div class="prd-title">새내기 직장인을 위한 <br>신용대출상품</div>
                            <div class="prd-sub">NH첫시작엔대출</div>
                        </div>
                        <div class="hash-tag"><span>#신용대출</span><span>#사회초년생</span></div>
                    </div>
                </a>
            </div>
            <div class="swiper-slide">
                <a href="javascript:moveProductDetailPage(40000927)">
                    <div class="submain-banner type04">
                        <div class="banner-txt-wrap">
                            <div class="prd-title">공적연금을 받는 고객이라면<br>간편하게 신청</div>
                            <div class="prd-sub">NH연금엔대출</div>
                        </div>
                        <div class="hash-tag"><span>#신용대출</span><span>#공적연금</span></div>
                    </div>
                </a>
            </div>
        </div>

        <div class="pagination-wrap">
            <div class="pagination-inner">
                <button type="button" class="slide_prev"><span class="hide">이전 슬라이드</span> </button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slide_next"><span class="hide">다음 슬라이드</span></button>
            </div>
            <a href="javascript:void(0);" class="button-stop" role="button">
                <span class="hide">정지</span>
            </a>
        </div>
    </div> 
</div>


<script>
    $(function(){
        var mainbanner = new Swiper('.submain-banner-swiper',{
            pagination : {
                el : '.swiper-pagination',
                clickable :true, // 2024 접근성 수정
                type:'fraction' // 2024 접근성 수정
            },
            navigation : {
                nextEl : '.slide_next',
                prevEl : '.slide_prev'
            },
            loop:true,
            autoplay:{
                delay: 4000
            },
            speed:500,
            spaceBetween:24,
            grabCursor:true,
            observer : true,
            observeParents : true,
            // 2024 접근성 추가
            on:{
                init:function () {
                    $(this.$el).find('.swiper-slide-active').attr('aria-hidden','false').siblings().attr('aria-hidden','true');
                },
                slideChangeTransitionEnd: function () {
                    $(this.$el).find('.swiper-slide-active').attr('aria-hidden','false').siblings().attr('aria-hidden','true');
                }
            },
            a11y:{
                paginationBulletMessage : '{{index}}번 슬라이드로 이동'
            }
            // [240312] 사업부 요청으로 배너 액션 수정
        });

        mainbanner.on('touchEnd', function (transitionEnd) {
            var autoPlay = mainbanner.autoplay.running
            if(autoPlay == false){
                $('.pagination-wrap .button-stop').addClass('-active').find('.hide').text('재생');
            };
        });

         // 배너 시작, 정지
        $('.submain-banner-wrap .button-stop').click(function(){
            $(this).toggleClass('-active');
            if($(this).hasClass('-active')){
                $(this).find('.hide').text('재생');
                mainbanner.autoplay.stop();
            }
            else {
                $(this).find('.hide').text('정지');
                mainbanner.autoplay.start();
            }
        });

        // 배너 한개일 경우 비활성화
        if( $('.submain-banner-wrap .swiper-slide').length <= 3 ){
            $('.submain-banner-wrap .swiper-wrapper').addClass('-disabled');
            $('.submain-banner-wrap .pagination-wrap').attr('aria-hidden','true');
            mainbanner.destroy();
        };

    })
</script>
